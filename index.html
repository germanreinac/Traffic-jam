<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="description" content="A minimalist isometric traffic toy. Place arrow boards, divert the highway, fill the screen.">
<meta name="theme-color" content="#f1efe9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f1e1d'/%3E%3Cpath d='M26 16 16 7v5.500H6v7h10V25z' fill='%23ff5a36'/%3E%3C/svg%3E">
<title>Traffic Jam</title>
<style>
  html, body { margin: 0; height: 100%; background: #f1efe9; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
  .hud {
    position: fixed; left: 0; right: 0; text-align: center; pointer-events: none;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .08em; color: #1a1a1a; user-select: none; -webkit-user-select: none;
  }
  .hud span { background: #f1efe9; padding: 3px 8px; border-radius: 3px; }
  #stats { top: 18px; }
  #hint { bottom: 14px; }
  #hint span { color: rgba(26,26,26,.55); }
  #hint i { font-style: normal; }
  @media (max-width: 560px) { #hint i { display: none; } }
  #sound {
    position: fixed; top: 14px; right: 14px; border: 0; cursor: pointer;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .08em; color: rgba(26,26,26,.55); background: #f1efe9;
    padding: 6px 8px; border-radius: 3px;
  }
  #sound.on { color: #ff5a36; }
  @media (max-width: 560px) { #stats { text-align: left; left: 10px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="stats"><span id="statsText"></span></div>
<button id="sound">sound off</button>
<div class="hud" id="hint"><span>pick arrow &nbsp;·&nbsp; tap to rotate<i> &nbsp;·&nbsp; drag back to remove</i></span></div>
<script>
(() => {
  // ---------- config ----------
  const LANES = [0, 1];         // highway columns; traffic flows toward +y
  const SPEED = 1.7;            // tiles / second
  const R = 0.23;               // collision radius (tiles)
  const GAP = 0.8;              // following distance
  const MAX_CARS = 420;
  const FILL_MEMORY = 9;        // seconds a tile stays "filled" after a car passes
  const INK = '#1a1a1a', PAPER = '#f1efe9', ACCENT = '#ff5a36';
  const WHITE = ['#fbfaf6', '#e2dfd6', '#cfcbc0'];   // top, left, right faces
  const BLACK = ['#3a3936', '#2b2a28', '#1f1e1d'];
  // arrow directions, in tap-to-rotate order
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  const dirIndex = (dx, dy) => DIRS.findIndex(d => d[0] === dx && d[1] === dy);

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const statsEl = document.getElementById('statsText');

  let W = 0, H = 0, TW = 0, TH = 0, OX = 0, OY = 0;
  let spawnY = -10, visTiles = [], gridBounds = [0, 0, 0, 0];
  let tray = { x: 0, y: 0, r: 36 };
  let cars = [], rings = [], shocks = [], hotspots = [], bits = [], skids = [];
  let beat = 0, lastBeat = 0;
  const arrows = new Map();     // "x,y" -> index into DIRS
  const heat = new Map();       // "x,y" -> sim time of last car
  let simT = 0, paused = false, incidents = 0, nextId = 1;
  let spawnT = LANES.map(() => Math.random());

  // pointer state
  let ptr = null;               // {x, y} last pointer position (mouse only for hover)
  let drag = null;              // {type:'new'|'move', idx, key, sx, sy, moved}
  let armed = false;            // arrow picked from tray, waiting for a tile tap

  // ---------- projection ----------
  const px = (gx, gy) => OX + (gx - gy) * TW / 2;
  const py = (gx, gy) => OY + (gx + gy) * TH / 2;
  function toGrid(sx, sy) {
    const a = (sx - OX) / (TW / 2), b = (sy - OY) / (TH / 2);
    return [(a + b) / 2, (b - a) / 2];
  }
  // distance outside the viewport, in tile widths
  function off(gx, gy) {
    const sx = px(gx, gy), sy = py(gx, gy);
    return Math.max(0, -sx, sx - W, -sy, sy - H) / TW;
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    TW = Math.max(54, Math.min(110, Math.min(W, H) / 8.5));
    TH = TW / 2;
    OX = W / 2 - TW / 4;        // the highway runs through the screen centre
    OY = H / 2 - TH / 4;
    tray = { x: W / 2, y: H - 84, r: Math.max(34, TW * 0.42) };

    // grid extent covering the viewport
    const cs = [toGrid(0, 0), toGrid(W, 0), toGrid(0, H), toGrid(W, H)];
    gridBounds = [
      Math.floor(Math.min(...cs.map(c => c[0]))) - 1, Math.ceil(Math.max(...cs.map(c => c[0]))) + 1,
      Math.floor(Math.min(...cs.map(c => c[1]))) - 1, Math.ceil(Math.max(...cs.map(c => c[1]))) + 1,
    ];
    visTiles = [];
    for (let x = gridBounds[0]; x <= gridBounds[1]; x++)
      for (let y = gridBounds[2]; y <= gridBounds[3]; y++)
        if (off(x, y) === 0) visTiles.push(x + ',' + y);

    spawnY = 0;
    while (LANES.some(l => off(l, spawnY) < 1)) spawnY--;
  }

  // ---------- sound (off until asked for) ----------
  let actx = null, master = null, soundOn = false, lastCrunch = 0;
  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    if (soundOn && !actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      master = actx.createGain(); master.gain.value = 0.6;
      master.connect(comp); comp.connect(actx.destination);
    }
    if (actx) actx[soundOn ? 'resume' : 'suspend']();
    soundBtn.textContent = soundOn ? 'sound on' : 'sound off';
    soundBtn.classList.toggle('on', soundOn);
  });
  const audible = () => soundOn && actx && actx.state === 'running' && !document.hidden;
  // overdriven sub-bass thump
  function kick(vol) {
    if (!audible()) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(), ws = actx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) curve[i] = Math.tanh((i / 128 - 1) * 4);
    ws.curve = curve;
    o.frequency.setValueAtTime(95, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 0.14);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(ws); ws.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.34);
  }
  // short dusty crunch
  function crunch(vol) {
    if (!audible() || actx.currentTime - lastCrunch < 0.05) return;
    lastCrunch = actx.currentTime;
    const t = actx.currentTime, len = Math.floor(actx.sampleRate * 0.12);
    const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf;
    f.type = 'bandpass'; f.frequency.value = 400 + Math.random() * 1400; f.Q.value = 0.8;
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  }

  // ---------- ground distortion ----------
  // Crashes send ripples through the grid; busy crossings throb on a beat.
  function warp(gx, gy) {
    let ox = 0, oy = 0, lift = 0;
    for (const s of shocks) {
      const rx = gx - s.x, ry = gy - s.y;
      if (rx > 7 || rx < -7 || ry > 7 || ry < -7) continue;
      const d = Math.hypot(rx, ry) || 1e-6;
      const q = (d - s.t * 7) / 0.7;
      const g = Math.exp(-q * q) * s.a * (1 - s.t / 0.8);
      ox += rx / d * g * 0.22; oy += ry / d * g * 0.22; lift += g * 0.16;
    }
    for (const h of hotspots) {
      const rx = gx - h.x, ry = gy - h.y;
      if (rx > 6 || rx < -6 || ry > 6 || ry < -6) continue;
      const d2 = rx * rx + ry * ry, d = Math.sqrt(d2) || 1e-6;
      const f = Math.exp(-d2 / 5) * h.e;
      const m = f * beat * Math.min(d, 1);
      ox += rx / d * m * 0.2; oy += ry / d * m * 0.2;
      lift += f * (beat * 0.14 + 0.025 * Math.sin(simT * 31 + gx * 3.1 + gy * 4.7));
    }
    return [(ox - oy) * TW / 2, (ox + oy) * TH / 2 - lift * TW];
  }
  const warping = () => shocks.length || hotspots.length;
  function P(gx, gy) {
    if (!warping()) return [px(gx, gy), py(gx, gy)];
    const w = warp(gx, gy);
    return [px(gx, gy) + w[0], py(gx, gy) + w[1]];
  }

  function impact(a, b, nx, ny) {
    const first = !a.hit || !b.hit, k = first ? 1 : 0.65;
    const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    [a, b].forEach((c, i) => {
      const sg = i ? 1 : -1;
      c.kx += sg * nx * 1.5 * k + (Math.random() - 0.5) * 0.9;
      c.ky += sg * ny * 1.5 * k + (Math.random() - 0.5) * 0.9;
      c.spin += (Math.random() - 0.5) * 22 * k;
      c.vz = (0.9 + Math.random() * 1.1) * k;
      c.v *= 0.35;
      c.cool = 0.28 + Math.random() * 0.2;
      c.daze = 0.55;
      c.hit = true;
    });
    incidents++;
    rings.push({ x, y, t: 0 });
    shocks.push({ x, y, t: 0, a: k });
    if (shocks.length > 12) shocks.shift();
    let h = hotspots.find(h => Math.hypot(h.x - x, h.y - y) < 2.5);
    if (!h) hotspots.push(h = { x, y, e: 0 });
    h.x += (x - h.x) * 0.15; h.y += (y - h.y) * 0.15;
    h.e = Math.min(1, h.e + 0.14);
    for (let i = 0; i < 5 && bits.length < 260; i++) {
      const an = Math.random() * 6.28, sp = 0.6 + Math.random() * 2.2;
      bits.push({ x, y, z: 0.1, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp,
                  vz: 1.5 + Math.random() * 2.5, t: 0, hot: Math.random() < 0.3 });
    }
    skids.push({ x: x + (Math.random() - 0.5) * 0.4, y: y + (Math.random() - 0.5) * 0.4,
                 r: 0.18 + Math.random() * 0.22, t: 0 });
    if (skids.length > 160) skids.shift();
    crunch(first ? 0.5 : 0.28);
  }

  // ---------- simulation ----------
  function spawn(lane) {
    for (const c of cars) if (Math.hypot(c.x - lane, c.y - spawnY) < 0.95) return false;
    cars.push({
      id: nextId++, x: lane, y: spawnY, dx: 0, dy: 1, ang: Math.PI / 2, v: SPEED,
      hit: false, m: 0.6 + Math.random() * 0.8,
      kx: 0, ky: 0, spin: 0, z: 0, vz: 0, cool: 0, daze: 0,
    });
    return true;
  }

  // An arrow board diverts the whole road, not just its own tile: lanes on
  // either side turn along a diagonal so the lines stay side by side.
  function arrowFor(tx, ty, dx, dy) {
    for (const [ax, ay] of [[-dy, dx], [dy, -dx]]) {
      const want = dirIndex(ax, ay);
      for (let s = -1; s <= 1; s++) {
        const key = (tx - s * (ax - dx)) + ',' + (ty - s * (ay - dy));
        if (arrows.get(key) === want) return [ax, ay];
      }
    }
    return null;
  }

  function step(dt) {
    simT += dt;
    if (cars.length < MAX_CARS) {
      LANES.forEach((lane, i) => {
        spawnT[i] -= dt;
        if (spawnT[i] <= 0) spawnT[i] = spawn(lane) ? 0.65 + Math.random() * 0.9 : 0.2;
      });
    }

    for (const c of cars) {
      // keep distance from cars ahead going the same way
      let target = SPEED;
      for (const o of cars) {
        if (o === c || o.dx !== c.dx || o.dy !== c.dy) continue;
        const rx = o.x - c.x, ry = o.y - c.y;
        const along = rx * c.dx + ry * c.dy;
        const lat = Math.abs(rx * c.dy - ry * c.dx);
        if (along > 0 && along < GAP + 0.5 && lat < 0.3)
          target = Math.min(target, SPEED * Math.max(0, (along - GAP) / 0.5));
      }
      c.v += (target - c.v) * Math.min(1, 10 * dt);
      c.x += (c.dx * c.v + c.kx) * dt; c.y += (c.dy * c.v + c.ky) * dt;
      const kf = Math.exp(-4 * dt);
      c.kx *= kf; c.ky *= kf;
      c.cool -= dt; c.daze -= dt;
      if (c.z > 0 || c.vz > 0) {
        c.z += c.vz * dt; c.vz -= 9 * dt;
        if (c.z < 0) { c.z = 0; c.vz = 0; }
      }
      // pull back to lane centre (loosely while dazed)
      const k = Math.min(1, (c.daze > 0 ? 1.2 : 5) * dt);
      if (c.dx !== 0) c.y += (Math.round(c.y) - c.y) * k;
      else c.x += (Math.round(c.x) - c.x) * k;
      // obey arrow boards once the tile centre is reached
      const tx = Math.round(c.x), ty = Math.round(c.y);
      if (arrows.size && (c.x - tx) * c.dx + (c.y - ty) * c.dy >= 0) {
        const a = arrowFor(tx, ty, c.dx, c.dy);
        if (a) { c.dx = a[0]; c.dy = a[1]; }
      }
      if (off(c.x, c.y) === 0) heat.set(tx + ',' + ty, simT);
      // steer body toward heading (battered cars straighten out slowly)
      let d = Math.atan2(c.dy, c.dx) - c.ang;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      c.ang += d * Math.min(1, (c.daze > 0 ? 2 : c.hit ? 6 : 12) * dt) + c.spin * dt;
      c.spin *= Math.exp(-3.5 * dt);
    }

    // collisions: crossing traffic crashes, turns black, and shoves its way through
    for (let i = 0; i < cars.length; i++) {
      const a = cars[i];
      for (let j = i + 1; j < cars.length; j++) {
        const b = cars[j];
        let nx = b.x - a.x, ny = b.y - a.y;
        if (nx > 0.5 || nx < -0.5 || ny > 0.5 || ny < -0.5) continue;
        const d = Math.hypot(nx, ny);
        if (d >= 2 * R || d === 0) continue;
        nx /= d; ny /= d;
        const push = 2 * R - d, mt = a.m + b.m;
        a.x -= nx * push * b.m / mt; a.y -= ny * push * b.m / mt;
        b.x += nx * push * a.m / mt; b.y += ny * push * a.m / mt;
        if (a.dx === b.dx && a.dy === b.dy) continue;
        // slide around each other so the knot never locks up
        const slip = 0.7 * dt;
        a.x += ny * slip; a.y -= nx * slip;
        b.x -= ny * slip; b.y += nx * slip;
        if (a.cool <= 0 || b.cool <= 0) impact(a, b, nx, ny);
      }
    }

    cars = cars.filter(c => off(c.x, c.y) <= 2.4);
    for (const r of rings) r.t += dt;
    rings = rings.filter(r => r.t < 0.7);
    for (const s of shocks) s.t += dt;
    shocks = shocks.filter(s => s.t < 0.8);
    for (const h of hotspots) h.e *= Math.exp(-0.45 * dt);
    hotspots = hotspots.filter(h => h.e > 0.03);
    for (const p of bits) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 9 * dt;
      if (p.z < 0) { p.z = 0; p.vz *= -0.35; p.vx *= 0.5; p.vy *= 0.5; }
    }
    bits = bits.filter(p => p.t < 1.1);
    for (const k of skids) k.t += dt;
    skids = skids.filter(k => k.t < 25);
    // the beat: crossings throb together, louder the busier they are
    const ph = (simT * 2.1) % 1;
    beat = Math.exp(-ph * 5);
    if (ph < lastBeat) {
      const e = hotspots.reduce((m, h) => Math.max(m, h.e), 0);
      if (e > 0.15) kick(0.25 + 0.6 * e);
    }
    lastBeat = ph;
  }

  // ---------- rendering ----------
  function poly(pts, fill, stroke) {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  // iso box: footprint centred at (cx,cy), rotated by ang, from height z0 to z1 (px)
  function box(cx, cy, ang, hl, hw, z0, z1, top, left, right) {
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const loc = [[hl, hw], [-hl, hw], [-hl, -hw], [hl, -hw]];
    const g = loc.map(([f, s]) => [cx + f * ca - s * sa, cy + f * sa + s * ca]);
    for (let i = 0; i < 4; i++) {
      const p = g[i], q = g[(i + 1) % 4];
      const nx = (p[0] + q[0]) / 2 - cx, ny = (p[1] + q[1]) / 2 - cy;
      if (nx + ny <= 0) continue;                       // facing away from camera
      poly([[px(...p), py(...p) - z0], [px(...q), py(...q) - z0],
            [px(...q), py(...q) - z1], [px(...p), py(...p) - z1]],
           nx - ny > 0 ? right : left, INK);
    }
    poly(g.map(p => [px(...p), py(...p) - z1]), top, INK);
  }

  function shadow(x, y, s) {
    ctx.fillStyle = 'rgba(26,26,26,.10)';
    ctx.beginPath();
    ctx.ellipse(px(x, y), py(x, y), TW * s, TH * s, 0, 0, 7);
    ctx.fill();
  }

  function drawCar(c) {
    if (off(c.x, c.y) > 0.6) return;
    const h = TW * 0.13, col = c.hit ? BLACK : WHITE, z = c.z * TW * 0.5;
    const w = warping() ? warp(c.x, c.y) : null;
    if (w) { ctx.save(); ctx.translate(w[0], w[1]); }
    shadow(c.x, c.y, 0.2);
    box(c.x, c.y, c.ang, 0.3, 0.16, z, z + h, ...col);
    const ox = -0.05 * Math.cos(c.ang), oy = -0.05 * Math.sin(c.ang);
    box(c.x + ox, c.y + oy, c.ang, 0.14, 0.125, z + h, z + h * 1.75, ...col);
    if (w) ctx.restore();
  }

  // roadworks arrow board: a little trailer carrying a big lit arrow panel
  function drawBoard(x, y, idx, alpha, glow) {
    const [dx, dy] = DIRS[idx];
    const ang = Math.atan2(dy, dx);
    const zb = TW * 0.2, zt = TW * 0.6, zm = (zb + zt) / 2;
    const at = (u, z) => [px(x + u * dx, y + u * dy), py(x + u * dx, y + u * dy) - z];
    ctx.save();
    if (warping()) ctx.translate(...warp(x, y));
    ctx.globalAlpha = alpha;
    shadow(x, y, 0.26);
    box(x, y, ang, 0.3, 0.1, 0, TW * 0.07, ...WHITE);
    ctx.strokeStyle = INK;
    ctx.beginPath();
    for (const u of [-0.2, 0.2]) { ctx.moveTo(...at(u, TW * 0.07)); ctx.lineTo(...at(u, zb)); }
    ctx.stroke();
    poly([at(-0.4, zb), at(0.4, zb), at(0.4, zt), at(-0.4, zt)], BLACK[2], INK);
    const shape = [[0.3, 0], [0.04, 0.14], [0.04, 0.055], [-0.28, 0.055],
                   [-0.28, -0.055], [0.04, -0.055], [0.04, -0.14]];
    ctx.globalAlpha = alpha * glow;
    ctx.shadowColor = ACCENT; ctx.shadowBlur = TW * 0.3;
    poly(shape.map(([u, v]) => at(u, zm + v * TW)), ACCENT, null);
    ctx.restore();
  }

  function tileAtPoint(sx, sy) {
    const [gx, gy] = toGrid(sx, sy);
    return [Math.round(gx), Math.round(gy)];
  }
  const inTray = (sx, sy) => Math.hypot(sx - tray.x, sy - tray.y) < tray.r + 6;

  function draw(time) {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    ctx.lineJoin = 'round';

    // worn tiles: where traffic has recently been
    let filled = 0;
    for (const key of visTiles) {
      const t = heat.get(key);
      if (t === undefined || simT - t > FILL_MEMORY) continue;
      filled++;
      const [x, y] = key.split(',').map(Number);
      ctx.globalAlpha = 0.07 * Math.min(1, (FILL_MEMORY - (simT - t)) / 2);
      poly([[x - .5, y - .5], [x + .5, y - .5], [x + .5, y + .5], [x - .5, y + .5]]
        .map(p => P(...p)), INK, null);
    }
    // scorch marks left by crashes
    ctx.fillStyle = INK;
    for (const k of skids) {
      ctx.globalAlpha = 0.09 * Math.min(1, (25 - k.t) / 8);
      const [sx, sy] = P(k.x, k.y);
      ctx.beginPath(); ctx.ellipse(sx, sy, TW * k.r, TH * k.r, 0, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // grid
    const [x0, x1, y0, y1] = gridBounds;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(26,26,26,.13)';
    ctx.beginPath();
    if (!warping()) {
      for (let x = x0; x <= x1; x++) {
        ctx.moveTo(px(x - .5, y0), py(x - .5, y0)); ctx.lineTo(px(x - .5, y1), py(x - .5, y1));
      }
      for (let y = y0; y <= y1; y++) {
        ctx.moveTo(px(x0, y - .5), py(x0, y - .5)); ctx.lineTo(px(x1, y - .5), py(x1, y - .5));
      }
    } else {
      // bend every grid line through the distortion field
      const cols = x1 - x0 + 2, pts = [];
      for (let y = y0; y <= y1 + 1; y++)
        for (let x = x0; x <= x1 + 1; x++) pts.push(P(x - .5, y - .5));
      for (let y = 0; y <= y1 - y0 + 1; y++)
        for (let x = 0; x < cols; x++) {
          const p = pts[y * cols + x];
          x ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
        }
      for (let x = 0; x < cols; x++)
        for (let y = 0; y <= y1 - y0 + 1; y++) {
          const p = pts[y * cols + x];
          y ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
        }
    }
    ctx.stroke();

    // crash rings
    for (const r of rings) {
      const k = r.t / 0.7;
      ctx.strokeStyle = `rgba(255,90,54,${1 - k})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      const [sx, sy] = P(r.x, r.y);
      ctx.ellipse(sx, sy, TW * (0.2 + k * 0.9), TH * (0.2 + k * 0.9), 0, 0, 7);
      ctx.stroke();
    }

    // cars and boards, back to front
    const glow = 0.8 + 0.2 * Math.sin(time / 260);
    ctx.lineWidth = Math.max(1, TW / 42);
    const items = cars.map(c => ({ d: c.x + c.y, c }));
    for (const [key, idx] of arrows) {
      const [x, y] = key.split(',').map(Number);
      items.push({ d: x + y + 0.05, b: [x, y, idx, 1] });
    }
    // ghost of the arrow being carried
    const carrying = (drag && drag.moved) || (armed && ptr);
    if (carrying && ptr && !inTray(ptr.x, ptr.y)) {
      const [x, y] = tileAtPoint(ptr.x, ptr.y);
      items.push({ d: x + y + 0.05, b: [x, y, drag ? drag.idx : 0, 0.55] });
    }
    items.sort((p, q) => p.d - q.d);
    for (const it of items) it.c ? drawCar(it.c) : drawBoard(...it.b, glow);

    // flying debris
    for (const p of bits) {
      const [sx, sy] = P(p.x, p.y), sz = Math.max(2, TW * 0.035);
      ctx.globalAlpha = Math.min(1, (1.1 - p.t) * 3);
      ctx.fillStyle = p.hot ? ACCENT : INK;
      ctx.fillRect(sx - sz / 2, sy - p.z * TW * 0.5 - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    // tray: where arrows are picked up from (and dropped to remove)
    const hot = armed || (drag && drag.moved && ptr && inTray(ptr.x, ptr.y));
    ctx.lineWidth = hot ? 2 : 1.5;
    ctx.beginPath();
    ctx.arc(tray.x, tray.y, tray.r, 0, 7);
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.strokeStyle = hot ? ACCENT : INK; ctx.stroke();
    ctx.save();
    ctx.translate(tray.x - px(0, 0), tray.y + TW * 0.26 - py(0, 0));
    ctx.lineWidth = Math.max(1, TW / 42);
    drawBoard(0, 0, 0, 1, glow);
    ctx.restore();

    const pct = visTiles.length ? Math.round(100 * filled / visTiles.length) : 0;
    statsEl.textContent =
      String(pct).padStart(3, '0') + '% filled   ' +
      String(incidents).padStart(3, '0') + ' incidents' + (paused ? '   paused' : '');
  }

  // ---------- input ----------
  canvas.addEventListener('pointerdown', e => {
    ptr = { x: e.clientX, y: e.clientY };
    const [x, y] = tileAtPoint(e.clientX, e.clientY), key = x + ',' + y;
    if (e.button === 2) { arrows.delete(key); return; }
    canvas.setPointerCapture(e.pointerId);
    if (inTray(e.clientX, e.clientY)) {
      drag = { type: 'new', idx: 0, sx: e.clientX, sy: e.clientY, moved: false };
    } else if (arrows.has(key)) {
      armed = false;
      drag = { type: 'move', key, idx: arrows.get(key), sx: e.clientX, sy: e.clientY, moved: false };
    } else if (armed) {
      arrows.set(key, 0);
      armed = false;
    }
  });
  canvas.addEventListener('pointermove', e => {
    ptr = { x: e.clientX, y: e.clientY };
    if (drag && !drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) {
      drag.moved = true;
      armed = false;
      if (drag.type === 'move') arrows.delete(drag.key);
    }
  });
  canvas.addEventListener('pointerup', e => {
    ptr = e.pointerType === 'mouse' ? { x: e.clientX, y: e.clientY } : null;
    if (!drag) return;
    if (!drag.moved) {
      if (drag.type === 'new') armed = !armed;
      else arrows.set(drag.key, (drag.idx + 1) % DIRS.length);
    } else if (!inTray(e.clientX, e.clientY)) {
      const [x, y] = tileAtPoint(e.clientX, e.clientY);
      arrows.set(x + ',' + y, drag.idx);
    }
    drag = null;
  });
  canvas.addEventListener('pointercancel', () => {
    if (drag && drag.type === 'move') arrows.set(drag.key, drag.idx);
    drag = null; ptr = null;
  });
  canvas.addEventListener('pointerleave', () => { if (!drag) ptr = null; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (e.key === 'c' || e.key === 'C') arrows.clear();
    if (e.key === 'Escape') armed = false;
    if (e.key === ' ') { paused = !paused; e.preventDefault(); }
  });
  addEventListener('resize', resize);

  // ---------- loop ----------
  resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) { step(dt / 2); step(dt / 2); }
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // test hook
  window.__tj = {
    arrows, step, px, py,
    get cars() { return cars; },
    get stats() { return { incidents, n: cars.length, black: cars.filter(c => c.hit).length }; },
  };
})();
</script>
</body>
</html>
